name: Mirror to GitLab

on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]
  workflow_dispatch:

jobs:
  to_gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/techmohammed/Borsat-Dinari.git
          git push gitlab --all --force
          git push gitlab --tags --force
