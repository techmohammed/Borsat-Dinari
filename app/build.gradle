plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// نقرأ بيانات توقيع الإصدار (release) من ملف keystore.properties خارج
// Git، حتى ما تنكتب الباسوردات مباشرة بهذا الملف. لو الملف غير موجود
// (أول مرة، أو عند شخص ثاني ينزل المشروع بدون الملف)، نتجاهل توقيع
// الإصدار بهدوء ويبني release بدون توقيع خاص بدل ما يفشل البناء بالكامل.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.mohammed.currencyapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.mokhtar.com"
        minSdk 21
        targetSdk 36
        versionCode 19
        versionName "1.1.7"
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            vcsInfo {
                include = false
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
    }

    // ملفات معلومات صغيرة تُضاف داخل META-INF (أرقام نسخ المكتبات وبيانات البناء) ما يغطيها توقيع v1
    // فتطلع كتحذيرات بفحص apksigner؛ ما يحتاجها التطبيق وقت التشغيل.
    packaging {
        resources {
            excludes += 'META-INF/*.version'
            excludes += 'META-INF/com/android/build/gradle/app-metadata.properties'
            excludes += 'META-INF/version-control-info.textproto'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
